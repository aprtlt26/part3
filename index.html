<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flowfield Sonoro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: black;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        /* Control de volumen minimalista - NO altera la estética original */
        .audio-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 500;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .volume-slider {
            width: 80px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .mute-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        
        .mute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .volume-value {
            min-width: 38px;
            text-align: right;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        @media (max-width: 768px) {
            .audio-controls {
                top: 12px;
                right: 12px;
                padding: 6px 12px;
                gap: 8px;
            }
            .volume-slider {
                width: 60px;
            }
            .volume-value {
                font-size: 10px;
                min-width: 32px;
            }
        }
        
        .start-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
</head>
<body>
    <div class="audio-controls" style="display: none;" id="audioControls">
        <div class="volume-control">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="30">
            <span class="volume-value" id="volumeValue">30%</span>
        </div>
        <button class="mute-btn" id="muteBtn">🔇 Mute</button>
    </div>
    <div class="start-hint" id="startHint">🎧 Toca la pantalla para comenzar</div>

    <script>
        // ========== TU CÓDIGO ORIGINAL COMPLETO (sin cambios visuales ni arquitectónicos) ==========
        let inc = 0.05;
        let scl = 10;
        let cols, rows;
        let zoff = 0;
        let particles = [];
        let flowfield;
        let maxSpeed = 0.3;
        let audioStarted = false;
        let globalReverb, noiseOscillator, lfo;
        let erasePoint;
        let compressor;
        let envelope;
        let pulseInterval = 5000;
        let spatialOscillator;
        let frequencyLFO;
        
        // SOLO AGREGADO: variables para el control de volumen (no afectan tu lógica)
        let masterVolume = 0.3;
        let isMuted = false;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            cols = floor(width / scl);
            rows = floor(height / scl);
            flowfield = new Array(cols * rows);

            globalReverb = new p5.Reverb();
            globalReverb.set(20, 10); 

            compressor = new p5.Compressor();
            compressor.threshold(-40);
            compressor.ratio(4);  
            compressor.attack(0.05);  
            compressor.release(0.1); 

            noiseOscillator = new p5.Noise('pink');
            let lowPassFilter = new p5.LowPass();
            lowPassFilter.freq(300);
            noiseOscillator.disconnect();
            noiseOscillator.connect(lowPassFilter);
            lowPassFilter.connect(compressor);
            compressor.connect(globalReverb);

            envelope = new p5.Envelope();
            envelope.setADSR(0.5, 0.4, 0.05, 0.7);
            envelope.setRange(0.02, 0);

            noiseOscillator.amp(0.05);
            noiseOscillator.start();

            spatialOscillator = new p5.Oscillator('sine');
            spatialOscillator.freq(7.8);
            spatialOscillator.amp(0.1);
            spatialOscillator.pan(0);
            spatialOscillator.disconnect();
            spatialOscillator.connect(globalReverb);
            spatialOscillator.start();

            frequencyLFO = new p5.Oscillator('sine');
            frequencyLFO.freq(0.2);
            frequencyLFO.amp(2);
            frequencyLFO.disconnect();
            frequencyLFO.start();

            lfo = new p5.Oscillator('sine');
            lfo.freq(random(1 / 7, 1 / 5));
            lfo.disconnect();
            lfo.amp(0.4);
            lfo.start();

            for (let i = 0; i < 500; i++) {
                particles[i] = new Particle();
            }

            background(0);

            setInterval(() => {
                envelope.play(noiseOscillator, 0, 0.01);
            }, pulseInterval);
            
            // Configurar controles de volumen (SOLO AGREGADO, no modifica tu código)
            setupVolumeControls();
        }
        
        function setupVolumeControls() {
            const controls = document.getElementById('audioControls');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeValue = document.getElementById('volumeValue');
            const muteBtn = document.getElementById('muteBtn');
            
            volumeSlider.addEventListener('input', (e) => {
                masterVolume = e.target.value / 100;
                volumeValue.textContent = e.target.value + '%';
                if (isMuted) {
                    isMuted = false;
                    muteBtn.textContent = '🔇 Mute';
                }
                applyMasterVolume();
            });
            
            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) {
                    muteBtn.textContent = '🔊 Unmute';
                    setMuted(true);
                } else {
                    muteBtn.textContent = '🔇 Mute';
                    setMuted(false);
                    applyMasterVolume();
                }
            });
        }
        
        function applyMasterVolume() {
            if (isMuted) return;
            if (noiseOscillator) noiseOscillator.amp(0.05 * masterVolume);
            if (spatialOscillator) spatialOscillator.amp(0.1 * masterVolume);
            for (let p of particles) {
                if (p.oscillator && p.currentOscAmp) {
                    p.oscillator.amp(p.currentOscAmp * masterVolume);
                }
            }
        }
        
        function setMuted(muted) {
            if (muted) {
                if (noiseOscillator) noiseOscillator.amp(0);
                if (spatialOscillator) spatialOscillator.amp(0);
                for (let p of particles) {
                    if (p.oscillator) p.oscillator.amp(0);
                }
            } else {
                applyMasterVolume();
            }
        }

        // ===== TU DRAW ORIGINAL COMPLETO (sin cambios) =====
        function draw() {
            if (!audioStarted) return;

            background(0, 10);

            let yoff = 0;
            for (let y = 0; y < rows; y++) {
                let xoff = 0;
                for (let x = 0; x < cols; x++) {
                    let index = x + y * cols;
                    let angle = noise(xoff, yoff, zoff) * TWO_PI;
                    let v = p5.Vector.fromAngle(angle);
                    v.setMag(0.5);
                    flowfield[index] = v;
                    xoff += inc;
                }
                yoff += inc;
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].follow(flowfield);
                particles[i].update();
                particles[i].edges();
                particles[i].show();

                if (erasePoint && dist(erasePoint.x, erasePoint.y, particles[i].pos.x, particles[i].pos.y) < 50) {
                    particles[i].pos = createVector(random(width), random(height));
                }
            }

            zoff += 0.003;

            let noiseAmplitude = map(lfo.getAmp(), -1, 1, 0.01, 0.03);
            noiseOscillator.amp(noiseAmplitude, 0.6);

            let freqMod = map(frequencyLFO.getAmp(), -1, 1, 8, 12);
            spatialOscillator.freq(freqMod);

            if (erasePoint) {
                fill(0);
                noStroke();
                ellipse(erasePoint.x, erasePoint.y, 50);
            }
        }

        // ===== TU MOUSEPRESSED ORIGINAL =====
        function mousePressed() {
            if (!audioStarted) {
                userStartAudio();
                audioStarted = true;
                loop();
                document.getElementById('startHint').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('startHint').style.display = 'none';
                    document.getElementById('audioControls').style.display = 'flex';
                }, 500);
            }
        }

        // ===== TU TOUCHMOVED ORIGINAL (con volumen aplicado) =====
        function touchMoved() {
            erasePoint = createVector(mouseX, mouseY);

            let amplitudeMod = map(mouseY, 0, height, 0, 0.02);
            if (!isMuted) noiseOscillator.amp(amplitudeMod * masterVolume, 0.1);

            let panValue = map(mouseX, 0, width, -1, 1);
            spatialOscillator.pan(panValue);

            let spatialAmp = map(mouseY, 0, height, 0.00, 0.3);
            if (!isMuted) spatialOscillator.amp(spatialAmp * masterVolume, 0.1);
        }

        function touchEnded() {
            erasePoint = null;
        }

        // ===== TU CLASE PARTICLE ORIGINAL COMPLETA (solo agregué currentOscAmp para volumen) =====
        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = maxSpeed;
                this.prevPos = this.pos.copy();

                this.baseFreq = random(100, 7000);
                this.oscillator = new p5.Oscillator('sine');
                this.oscillator.freq(this.baseFreq);
                this.oscillator.amp(0);

                this.oscillator.disconnect();
                this.oscillator.connect(globalReverb);

                this.shouldPlaySound = random(1) < 0.10;
                this.soundDuration = random(5000, 10000);
                this.nextSoundTime = millis() + random(3000, 10000);
                this.currentOscAmp = 0;
            }

            follow(vectors) {
                let x = floor(this.pos.x / scl);
                let y = floor(this.pos.y / scl);
                let index = x + y * cols;
                let force = vectors[index];
                this.applyForce(force);
            }

            applyForce(force) {
                this.acc.add(force);
            }

            update() {
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                let currentTime = millis();
                if (this.shouldPlaySound && currentTime >= this.nextSoundTime) {
                    this.oscillator.start();

                    let frequencyMod = map(mouseY, 0, height, 300, 2000);
                    this.oscillator.freq(frequencyMod);

                    let amplitudeMod = map(mouseY, height, 0, 0, 0.02);
                    this.currentOscAmp = amplitudeMod;
                    let finalAmp = isMuted ? 0 : amplitudeMod * masterVolume;
                    this.oscillator.amp(finalAmp, 0.2);

                    setTimeout(() => {
                        this.oscillator.amp(0.01, 0.2);
                        setTimeout(() => this.oscillator.stop(), 1000);
                    }, this.soundDuration - 1000);

                    this.nextSoundTime = currentTime + random(3000, 10000);
                }
            }

            show() {
                stroke(255, 50);
                strokeWeight(1);
                line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
                this.prevPos = this.pos.copy();

                noFill();
                stroke(255, 20);
                strokeWeight(3);
                ellipse(this.pos.x, this.pos.y, 10);
            }

            edges() {
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.y > height) this.pos.y = 0;
                if (this.pos.y < 0) this.pos.y = height;
                this.prevPos = this.pos.copy();
            }
        }

        noLoop();
    </script>
</body>
</html>
