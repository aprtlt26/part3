<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TELESMA | A-PRTLT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: none;
        }
        
        body {
            background: black;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
        }
        
        /* ============================================ */
        /* MODAL TELESMA - ESQUINA SUPERIOR IZQUIERDA */
        /* ============================================ */
        .telesma-modal {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
            background: rgba(10, 10, 15, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px 18px;
            max-width: 260px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .telesma-modal:hover {
            background: rgba(10, 10, 15, 0.75);
            border-color: rgba(255, 255, 255, 0.35);
        }
        
        .telesma-title {
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(200, 220, 100, 0.9);
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .telesma-text {
            font-size: 10px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 4px;
        }
        
        .telesma-author {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            padding-top: 5px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .telesma-close {
            position: absolute;
            top: 8px;
            right: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .telesma-close:hover {
            color: rgba(255, 255, 255, 0.9);
        }
        
        /* ============================================ */
        /* INTERFAZ DE VOLUMEN MEJORADA */
        /* ============================================ */
        .audio-controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 15, 20, 0.45);
            backdrop-filter: blur(16px);
            padding: 14px 18px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            font-size: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }
        
        .audio-controls:hover {
            background: rgba(15, 15, 20, 0.6);
            border-color: rgba(255, 255, 255, 0.25);
        }
        
        .volume-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .volume-header span:first-child {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }
        
        .volume-percentage {
            font-size: 10px;
            color: rgba(200, 220, 100, 0.85);
            font-family: monospace;
        }
        
        .volume-slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .volume-icon {
            font-size: 14px;
            opacity: 0.7;
        }
        
        .volume-slider {
            width: 110px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: rgba(200, 220, 100, 0.9);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(200, 220, 100, 0.5);
            transition: transform 0.1s;
        }
        
        .volume-slider::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        
        .mute-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.75);
            font-size: 11px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 30px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            letter-spacing: 0.8px;
            margin-top: 6px;
        }
        
        .mute-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .mute-btn:active {
            transform: scale(0.97);
        }
        
        .start-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-family: monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
            letter-spacing: 0.8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        @media (max-width: 768px) {
            .telesma-modal {
                top: 12px;
                left: 12px;
                padding: 8px 14px;
                max-width: 220px;
            }
            .telesma-title {
                font-size: 9px;
            }
            .telesma-text {
                font-size: 8px;
            }
            .telesma-author {
                font-size: 7px;
            }
            .audio-controls {
                bottom: 15px;
                right: 15px;
                padding: 10px 14px;
                gap: 8px;
            }
            .volume-slider {
                width: 80px;
            }
            .mute-btn {
                padding: 4px 10px;
                font-size: 9px;
            }
            .start-hint {
                font-size: 10px;
                padding: 6px 16px;
                bottom: 20px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
</head>
<body>
    <!-- MODAL TELESMA - ESQUINA SUPERIOR IZQUIERDA -->
    <div class="telesma-modal" id="telesmaModal">
        <span class="telesma-close" id="closeModal">✕</span>
        <div class="telesma-title">◈ TELESMA ◈</div>
        <div class="telesma-text">Dispositivo táctil de interacción terapéutica<br>basado en flujos sonoros y campos vectoriales.</div>
        <div class="telesma-author">creado y desarrollado por<br>Alfonso Pretelt — psicólogo, músico experimental y desarrollador multimedia</div>
    </div>
    
    <!-- INTERFAZ DE VOLUMEN MEJORADA -->
    <div class="audio-controls" style="display: none;" id="audioControls">
        <div class="volume-header">
            <span>◈ campo sonoro</span>
            <span class="volume-percentage" id="volumeValue">30%</span>
        </div>
        <div class="volume-slider-container">
            <span class="volume-icon">🎧</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="35">
        </div>
        <button class="mute-btn" id="muteBtn">◉ silencio</button>
    </div>
    
    <div class="start-hint" id="startHint">🎧 toca para comenzar</div>

    <script>
        // ========== OPTIMIZADO PARA MÓVILES ==========
        let inc = 0.05;
        let scl = 12;
        let cols, rows;
        let zoff = 0;
        let particles = [];
        let flowfield;
        let maxSpeed = 0.3;
        let audioStarted = false;
        let globalReverb, noiseOscillator, lfo;
        let erasePoint;
        let compressor;
        let envelope;
        let pulseInterval = 5000;
        let spatialOscillator;
        let frequencyLFO;
        
        let masterVolume = 0.35;
        let isMuted = false;
        
        // Detección de móvil para ajustes automáticos
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const PARTICLE_COUNT = isMobile ? 280 : 500;
        const TARGET_FPS = isMobile ? 50 : 60;
        const SOUND_PROB = isMobile ? 0.07 : 0.10;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            frameRate(TARGET_FPS);
            
            cols = floor(width / scl);
            rows = floor(height / scl);
            flowfield = new Array(cols * rows);

            globalReverb = new p5.Reverb();
            globalReverb.set(20, 10); 

            compressor = new p5.Compressor();
            compressor.threshold(-40);
            compressor.ratio(4);  
            compressor.attack(0.05);  
            compressor.release(0.1); 

            noiseOscillator = new p5.Noise('pink');
            let lowPassFilter = new p5.LowPass();
            lowPassFilter.freq(300);
            noiseOscillator.disconnect();
            noiseOscillator.connect(lowPassFilter);
            lowPassFilter.connect(compressor);
            compressor.connect(globalReverb);

            envelope = new p5.Envelope();
            envelope.setADSR(0.5, 0.4, 0.05, 0.7);
            envelope.setRange(0.02, 0);

            noiseOscillator.amp(0.05);
            noiseOscillator.start();

            spatialOscillator = new p5.Oscillator('sine');
            spatialOscillator.freq(7.8);
            spatialOscillator.amp(0.1);
            spatialOscillator.pan(0);
            spatialOscillator.disconnect();
            spatialOscillator.connect(globalReverb);
            spatialOscillator.start();

            frequencyLFO = new p5.Oscillator('sine');
            frequencyLFO.freq(0.2);
            frequencyLFO.amp(2);
            frequencyLFO.disconnect();
            frequencyLFO.start();

            lfo = new p5.Oscillator('sine');
            lfo.freq(random(1 / 7, 1 / 5));
            lfo.disconnect();
            lfo.amp(0.4);
            lfo.start();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles[i] = new Particle();
            }

            background(0);

            setInterval(() => {
                if (audioStarted && !isMuted) envelope.play(noiseOscillator, 0, 0.01);
            }, pulseInterval);
            
            setupVolumeControls();
            setupModalClose();
        }
        
        function setupVolumeControls() {
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeValue = document.getElementById('volumeValue');
            const muteBtn = document.getElementById('muteBtn');
            
            volumeSlider.addEventListener('input', (e) => {
                masterVolume = e.target.value / 100;
                volumeValue.textContent = e.target.value + '%';
                if (isMuted) {
                    isMuted = false;
                    muteBtn.textContent = '◉ silencio';
                }
                applyMasterVolume();
            });
            
            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) {
                    muteBtn.textContent = '◉ activar';
                    setMuted(true);
                } else {
                    muteBtn.textContent = '◉ silencio';
                    setMuted(false);
                    applyMasterVolume();
                }
            });
        }
        
        function setupModalClose() {
            const closeBtn = document.getElementById('closeModal');
            const modal = document.getElementById('telesmaModal');
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                modal.style.opacity = '0';
                modal.style.transform = 'translateX(-20px)';
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            });
        }
        
        function applyMasterVolume() {
            if (isMuted) return;
            if (noiseOscillator) noiseOscillator.amp(0.05 * masterVolume);
            if (spatialOscillator) spatialOscillator.amp(0.1 * masterVolume);
            for (let p of particles) {
                if (p.oscillator && p.currentOscAmp) {
                    p.oscillator.amp(p.currentOscAmp * masterVolume);
                }
            }
        }
        
        function setMuted(muted) {
            if (muted) {
                if (noiseOscillator) noiseOscillator.amp(0);
                if (spatialOscillator) spatialOscillator.amp(0);
                for (let p of particles) {
                    if (p.oscillator) p.oscillator.amp(0);
                }
            } else {
                applyMasterVolume();
            }
        }

        function draw() {
            if (!audioStarted) return;

            background(0, 10);

            let yoff = 0;
            for (let y = 0; y < rows; y++) {
                let xoff = 0;
                for (let x = 0; x < cols; x++) {
                    let index = x + y * cols;
                    let angle = noise(xoff, yoff, zoff) * TWO_PI;
                    let v = p5.Vector.fromAngle(angle);
                    v.setMag(0.5);
                    flowfield[index] = v;
                    xoff += inc;
                }
                yoff += inc;
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].follow(flowfield);
                particles[i].update();
                particles[i].edges();
                particles[i].show();

                if (erasePoint && dist(erasePoint.x, erasePoint.y, particles[i].pos.x, particles[i].pos.y) < 50) {
                    particles[i].pos = createVector(random(width), random(height));
                }
            }

            zoff += 0.003;

            if (!isMuted) {
                let noiseAmplitude = map(lfo.getAmp(), -1, 1, 0.01, 0.03);
                noiseOscillator.amp(noiseAmplitude, 0.6);
                let freqMod = map(frequencyLFO.getAmp(), -1, 1, 8, 12);
                spatialOscillator.freq(freqMod);
            }

            if (erasePoint) {
                fill(0);
                noStroke();
                ellipse(erasePoint.x, erasePoint.y, 50);
            }
        }

        function mousePressed() {
            if (!audioStarted) {
                userStartAudio();
                audioStarted = true;
                loop();
                document.getElementById('startHint').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('startHint').style.display = 'none';
                    document.getElementById('audioControls').style.display = 'flex';
                }, 500);
            }
        }

        function touchMoved() {
            erasePoint = createVector(mouseX, mouseY);

            if (!isMuted) {
                let amplitudeMod = map(mouseY, 0, height, 0, 0.02);
                noiseOscillator.amp(amplitudeMod * masterVolume, 0.1);
                let panValue = map(mouseX, 0, width, -1, 1);
                spatialOscillator.pan(panValue);
                let spatialAmp = map(mouseY, 0, height, 0.00, 0.3);
                spatialOscillator.amp(spatialAmp * masterVolume, 0.1);
            }
        }

        function touchEnded() {
            erasePoint = null;
        }

        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = maxSpeed;
                this.prevPos = this.pos.copy();

                this.baseFreq = random(100, 7000);
                this.oscillator = new p5.Oscillator('sine');
                this.oscillator.freq(this.baseFreq);
                this.oscillator.amp(0);
                this.oscillator.disconnect();
                this.oscillator.connect(globalReverb);

                this.shouldPlaySound = random(1) < SOUND_PROB;
                this.soundDuration = random(5000, 10000);
                this.nextSoundTime = millis() + random(3000, 10000);
                this.currentOscAmp = 0;
            }

            follow(vectors) {
                let x = floor(this.pos.x / scl);
                let y = floor(this.pos.y / scl);
                let index = x + y * cols;
                let force = vectors[index];
                this.applyForce(force);
            }

            applyForce(force) {
                this.acc.add(force);
            }

            update() {
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                let currentTime = millis();
                if (audioStarted && this.shouldPlaySound && currentTime >= this.nextSoundTime && !isMuted) {
                    this.oscillator.start();

                    let frequencyMod = map(mouseY, 0, height, 300, 2000);
                    this.oscillator.freq(frequencyMod);

                    let amplitudeMod = map(mouseY, height, 0, 0, 0.02);
                    this.currentOscAmp = amplitudeMod;
                    let finalAmp = isMuted ? 0 : amplitudeMod * masterVolume;
                    this.oscillator.amp(finalAmp, 0.2);

                    setTimeout(() => {
                        this.oscillator.amp(0.01, 0.2);
                        setTimeout(() => this.oscillator.stop(), 1000);
                    }, this.soundDuration - 1000);

                    this.nextSoundTime = currentTime + random(3000, 10000);
                }
            }

            show() {
                stroke(255, 50);
                strokeWeight(1);
                line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
                this.prevPos = this.pos.copy();

                noFill();
                stroke(255, 20);
                strokeWeight(3);
                ellipse(this.pos.x, this.pos.y, 10);
            }

            edges() {
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.y > height) this.pos.y = 0;
                if (this.pos.y < 0) this.pos.y = height;
                this.prevPos = this.pos.copy();
            }
        }

        noLoop();
    </script>
</body>
</html>
